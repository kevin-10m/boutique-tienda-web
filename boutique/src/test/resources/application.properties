# Las pruebas usan una base temporal en memoria y no necesitan MySQL.
spring.datasource.url=jdbc:h2:mem:boutique;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
boutique.envio.estandar=3500
boutique.sinpe.numero=8888-0000
boutique.retiro.horario=lunes a sábado
boutique.correo.remitente=no-responder@boutique.test
