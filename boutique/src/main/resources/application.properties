spring.application.name=boutique

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/boutique_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica
spring.datasource.username=boutique_user
spring.datasource.password=Boutique2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.thymeleaf.cache=false

# Tarifa de envío a domicilio en colones, según el prototipo.
boutique.envio.estandar=${BOUTIQUE_ENVIO_ESTANDAR:3500}

# Datos de ejemplo que se muestran durante la compra.
boutique.sinpe.numero=8888-0000
boutique.retiro.horario=lunes a sábado, de 10:00 a. m. a 6:00 p. m.

# Correo: sin BOUTIQUE_MAIL_HOST, la confirmación se muestra en la consola.
spring.mail.host=${BOUTIQUE_MAIL_HOST:}
spring.mail.port=${BOUTIQUE_MAIL_PORT:587}
spring.mail.username=${BOUTIQUE_MAIL_USER:}
spring.mail.password=${BOUTIQUE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
boutique.correo.remitente=${BOUTIQUE_MAIL_USER:no-responder@boutique.test}
