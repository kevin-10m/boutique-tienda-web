<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0"/>

        <title>Boutique</title>

        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap"/>

        <link rel="stylesheet"
              th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>

        <link rel="stylesheet"
              th:href="@{/webjars/font-awesome/css/all.min.css}"/>

        <link rel="stylesheet"
              th:href="@{/css/estilos.css}"/>
    </head>

    <body>

        <header th:fragment="header">

            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">

                <div class="container py-2">

                    <a class="navbar-brand nombre-boutique"
                       th:href="@{/}">
                        BOUTIQUE
                    </a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#menuPrincipal">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                    <div class="collapse navbar-collapse"
                         id="menuPrincipal">

                        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/}">
                                    INICIO
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/catalogo}">
                                    CATÁLOGO
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/catalogo/ofertas}">
                                    OFERTAS
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/catalogo/buscar}">
                                    BUSCAR
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/cuenta}">
                                    CUENTA
                                </a>
                            </li>

                            <li class="nav-item" th:if="${esAdmin}">
                                <a class="nav-link" th:href="@{/admin/productos}">
                                    ADMIN
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="#">
                                    <i class="fa-regular fa-heart"></i>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/carrito}">
                                    CARRITO <span class="badge bg-dark" th:text="${unidadesCarrito}">0</span>
                                </a>
                            </li>

                        </ul>

                    </div>

                </div>

            </nav>

        </header>

        <span th:fragment="colones(monto)" th:text="|₡ ${#numbers.formatDecimal(monto,1,'WHITESPACE',0,'POINT')}|"></span>

        <div th:fragment="resumenCompra(r)" class="panel-claro p-4">
            <h2 class="h5 titulo-resumen mb-3">Resumen</h2>
            <dl class="row mb-0">
                <dt class="col-6 fw-normal">Subtotal</dt>
                <dd class="col-6 text-end fw-semibold"><span th:replace="~{general/fragmentos :: colones(${r.subtotal})}"></span></dd>
                <dt class="col-6 fw-normal" th:if="${r.cupon}">Descuento</dt>
                <dd class="col-6 text-end fw-semibold texto-terracota" th:if="${r.cupon}">
                    − <span th:replace="~{general/fragmentos :: colones(${r.descuento})}"></span>
                </dd>
                <dt class="col-6 fw-normal">Envío</dt>
                <dd class="col-6 text-end fw-semibold"><span id="montoEnvio" th:insert="~{general/fragmentos :: colones(${r.envio})}"></span></dd>
            </dl>
            <hr>
            <div class="d-flex justify-content-between align-items-center">
                <span class="h5 titulo-resumen mb-0">Total</span>
                <span class="h5 fw-bold mb-0" id="montoTotal" th:insert="~{general/fragmentos :: colones(${r.total})}"></span>
            </div>
        </div>

        <span th:fragment="precio(p)">
            <span th:if="${p.enOferta}" class="precio-anterior"
                  th:text="|₡ ${#numbers.formatDecimal(p.precio,1,'WHITESPACE',0,'POINT')}|"></span>
            <span th:text="|₡ ${#numbers.formatDecimal(p.precioFinal,1,'WHITESPACE',0,'POINT')}|"></span>
        </span>

        <header th:fragment="adminHeader">
            <nav class="navbar navbar-expand-md navbar-dark admin-nav">
                <div class="container py-2">
                    <a class="navbar-brand nombre-boutique text-white fs-6" th:href="@{/admin/productos}">BOUTIQUE · ADMIN</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="menuAdmin">
                        <ul class="navbar-nav mx-auto gap-md-3">
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/productos}">PRODUCTOS</a></li>
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/pedidos}">PEDIDOS</a></li>
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/cupones}">CUPONES</a></li>
                        </ul>
                        <a class="nav-link text-white" th:href="@{/}">VER TIENDA</a>
                    </div>
                </div>
            </nav>
        </header>

        <footer th:fragment="footer"
                class="footer-boutique mt-5">

            <div class="container py-4">

                <div class="row align-items-center">

                    <div class="col-md-6">

                        <strong>BOUTIQUE</strong>

                        <p class="mb-0">
                            © Boutique 2026
                        </p>

                    </div>

                    <div class="col-md-6 text-md-end mt-3 mt-md-0">

                        <span>INSTAGRAM</span>
                        <span class="mx-2">·</span>

                        <span>FACEBOOK</span>
                        <span class="mx-2">·</span>

                        <span>TIKTOK</span>

                    </div>

                </div>

            </div>

            <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

        </footer>

    </body>

</html>
