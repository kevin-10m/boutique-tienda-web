<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-5">
    <h1 class="mb-4">Mi cuenta</h1>
    <div th:if="${!correoActual.isEmpty()}" class="row g-4">
        <section class="col-lg-5">
            <div class="panel-claro p-4">
                <p class="small fw-bold texto-terracota mb-2">DATOS PERSONALES</p>
                <h2 class="h3 titulo-resumen" th:text="${perfil.nombre ?: 'Clienta de Boutique'}"></h2>
                <p class="text-muted" th:text="${perfil.correo}"></p>
                <p class="mb-1 small text-muted">PEDIDOS</p>
                <p class="fw-bold" th:text="${pedidos.size()}"></p>
                <form th:action="@{/cuenta/salir}" method="post">
                    <button class="btn btn-outline-dark rounded-0 w-100">CERRAR SESIÓN</button>
                </form>
            </div>
        </section>
        <section class="col-lg-7">
            <div class="producto-card p-4">
                <h2 class="h4 titulo-resumen mb-3">Historial de pedidos</h2>
                <p th:if="${pedidos.isEmpty()}" class="mb-0">Todavía no tenés pedidos.</p>
                <div class="table-responsive" th:unless="${pedidos.isEmpty()}">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>N.º pedido</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${pedidos}">
                            <td><a class="fw-bold text-dark" th:href="@{/pedidos/{n}(n=${p.numero})}" th:text="${p.numero}"></a></td>
                            <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}"></td>
                            <td class="fw-semibold" th:insert="~{general/fragmentos :: colones(${p.total})}"></td>
                            <td><span class="badge rounded-0" th:classappend="${p.estado.estilo}" th:text="${p.estado.etiqueta}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
    <div th:if="${correoActual.isEmpty()}" class="row g-4">
        <section class="col-md-5">
            <h2 class="h4">Iniciar sesión</h2>
            <p th:if="${param.error}" class="alert alert-danger" role="alert">Correo o contraseña incorrectos.</p>
            <p th:if="${param.registrada}" class="alert alert-success">Cuenta creada. Ya podés iniciar sesión.</p>
            <form th:action="@{/cuenta/ingresar}" method="post">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input id="correo" class="form-control mb-3" name="correo" type="email" autocomplete="username" required>
                <label for="clave" class="form-label">Contraseña</label>
                <input id="clave" class="form-control mb-3" name="clave" type="password" autocomplete="current-password" required>
                
                <!-- HU-03: Enlace de Recuperar Contraseña añadido aquí -->
                <div class="mb-3 text-end">
                    <a href="#" th:href="@{/auth/recuperar}" class="text-decoration-none text-muted small">¿Olvidaste tu contraseña?</a>
                </div>

                <button class="btn btn-dark">Ingresar</button>
            </form>
        </section>
        <section class="col-md-5">
            <h2 class="h4">Crear cuenta</h2>
            <p th:if="${errorRegistro}" th:text="${errorRegistro}" class="alert alert-danger" role="alert"></p>
            <form th:action="@{/cuenta/registro}" method="post">
                <label for="nuevoCorreo" class="form-label">Correo electrónico</label>
                <input id="nuevoCorreo" class="form-control mb-3" name="correo" type="email" maxlength="254" autocomplete="email" required>
                <label for="nuevaClave" class="form-label">Contraseña (mínimo 8 caracteres)</label>
                <input id="nuevaClave" class="form-control mb-3" name="clave" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
                <button class="btn btn-dark">Registrarme</button>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
