<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container py-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <p class="temporada mb-2">BOUTIQUE</p>
                    <h1 class="titulo-catalogo">Catálogo</h1>
                </div>
            </div>

            <!-- HU-06: Formulario de filtros y ordenamiento -->
            <form th:action="@{/catalogo}" method="get" class="row g-3 mb-5 p-4 bg-light rounded shadow-sm">
                <div class="col-md-4">
                    <label for="categoria" class="form-label fw-bold">Categoría</label>
                    <select name="categoria" id="categoria" class="form-select">
                        <option value="">Todas las categorías</option>
                        <option value="Vestidos">Vestidos</option>
                        <option value="Blusas">Blusas</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="orden" class="form-label fw-bold">Ordenar por</label>
                    <select name="orden" id="orden" class="form-select">
                        <option value="novedad">Más recientes (Novedad)</option>
                        <option value="precio-asc">Precio: menor a mayor</option>
                        <option value="precio-desc">Precio: mayor a menor</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-dark w-100">Aplicar filtros</button>
                </div>
            </form>

            <div class="mb-5">
                <span class="me-3">
                    Categorías:
                </span>
                <span th:each="categoria : ${categorias}"
                      class="badge categoria-badge me-2"
                      th:text="${categoria.nombre}">
                    Categoría
                </span>
            </div>

            <div class="row g-4">

                <div class="col-sm-6 col-lg-4"
                     th:each="producto : ${productos}">

                    <div class="card producto-card h-100">

                        <div class="position-relative">

                            <a th:href="@{/catalogo/producto/{id}(id=${producto.idProducto})}">

                                <img th:src="${producto.imagen}"
                                     th:alt="${producto.nombre}"
                                     class="card-img-top producto-imagen"/>

                            </a>

                            <span th:if="${producto.existencias == 0}"
                                  class="badge bg-dark agotado">
                                AGOTADO
                            </span>

                        </div>

                        <div class="card-body">

                            <small class="producto-categoria"
                                   th:text="${producto.categoria.nombre}">
                                Categoría
                            </small>

                            <h5 class="card-title mt-2"
                                th:text="${producto.nombre}">
                                Producto
                            </h5>

                            <p class="card-text"
                               th:text="${producto.descripcion}">
                                Descripción
                            </p>

                            <h5 class="precio-producto">

                                <span th:replace="~{general/fragmentos :: precio(${producto})}"></span>

                            </h5>

                            <small th:if="${producto.existencias > 0}"
                                   th:text="${producto.existencias + ' unidades disponibles'}">
                            </small>

                            <div class="mt-3">

                                <a th:href="@{/catalogo/producto/{id}(id=${producto.idProducto})}"
                                   class="btn btn-outline-dark btn-sm">

                                    VER DETALLE →

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
